[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tsunagu"
version = "0.1.0"
description = "A fictional cross-border CRM world (France, Japan, Taiwan) to build and evaluate data pipelines and CRM agents without real customer data."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Thibault Bordrie"}]
requires-python = ">=3.11"
keywords = ["crm", "synthetic-data", "line", "email-marketing", "duckdb", "japan", "taiwan", "data-engineering"]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "duckdb>=1.1",
  "faker>=30",
  "holidays>=0.60",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
tsunagu = "tsunagu.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tsunagu = ["contract.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 125
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B905"]

[tool.ruff.lint.per-file-ignores]
"src/tsunagu/events.py" = ["E501"]   # the event table reads best one event per line
